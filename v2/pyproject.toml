[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regex-compiler"
version = "2.0.0"
description = "正则表达式编译器 —— 从正则表达式到最小化 DFA 的完整实现"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zero" }]
keywords = ["compiler", "regex", "automata", "dfa", "nfa", "hopcroft", "compilers"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
    "Topic :: Text Processing :: General",
]

# 运行时零第三方依赖 —— 仅使用 Python 标准库
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "mypy>=1.8",
    "ruff>=0.4",
]

[project.scripts]
regex-compiler = "regex_compiler.cli:main"

[project.urls]
Homepage = "https://github.com/Zero/regex-compiler"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
include = ["regex_compiler*"]

[tool.setuptools.package-data]
"regex_compiler.web" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N801", "N802"]
